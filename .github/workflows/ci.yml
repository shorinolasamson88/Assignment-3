name: My devops-tool CI

on:
 push:
  branches: [ main ]

 pull_request:
  branches: [ main ]


jobs:
 validate:
  runs-on: ubuntu-latest

  steps:
   - name: checkout repository
     uses: actions/checkout@v4

   - name: setting executable permission
     run: chmod +x grade.sh app/*.sh scripts/*.sh tests/*.sh

   - name: Validation running lint.sh
     run: ./scripts/lint.sh

 test:
  runs-on: ubuntu-latest
  needs: [validate]

  steps:
   - name: checkout repository
     uses: actions/checkout@v4

   - name: setting executable permission
     run: chmod +x grade.sh app/*.sh scripts/*.sh tests/*.sh

   - name: testing running test.sh
     run: ./tests/test.sh


docker:
  runs-on: ubuntu-latest
  needs: [test]

  steps:
   - name: checkout repository
     uses: actions/checkout@v4

   - name: setting executable permission
     run: chmod +x grade.sh app/*.sh scripts/*.sh tests/*.sh


   - name: docker running build.sh
     run: ./scripts/build.sh

   
     
